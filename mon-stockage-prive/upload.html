<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockage Privé - Upload</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard { max-width: 800px; margin: 20px auto; padding: 20px; }
        .file-list { margin-top: 30px; }
        .file-item { 
            display: flex; justify-content: space-between; 
            padding: 15px; margin: 10px 0; 
            background: #f8f9fa; border-radius: 10px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover { background: rgba(102, 126, 234, 0.05); }
        .upload-area.dragover { background: rgba(102, 126, 234, 0.1); }
    </style>
</head>
<body>
    <div class="dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>📁 Stockage Privé</h1>
            <button onclick="logout()" class="logout-btn">Déconnexion</button>
        </div>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p>📤 Glissez-déposez ou cliquez pour uploader</p>
            <p style="color: #666; font-size: 14px;">Photos, fichiers texte (max 10Mo)</p>
            <input type="file" id="fileInput" multiple style="display: none;" accept="image/*,.txt,.pdf">
        </div>
        
        <div id="fileList" class="file-list"></div>
    </div>

    <script src="script.js"></script>
    <script>
        // Vérification d'accès
        if (!localStorage.getItem('accessToken') || 
            !PASSWORD_HASHES[localStorage.getItem('accessToken')]) {
            window.location.href = 'index.html';
        }

        // Drag & Drop
        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('dragover'), false);
        });

        uploadArea.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            uploadFiles(files);
        }

        function handleFiles() {
            uploadFiles(fileInput.files);
        }

        async function uploadFiles(files) {
            for (let file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    alert('Fichier trop volumineux (max 10Mo)');
                    continue;
                }
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('token', localStorage.getItem('accessToken'));
                
                try {
                    const response = await fetch('https://ton-backend.vercel.app/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        loadFiles();
                    }
                } catch (e) {
                    console.error('Erreur upload:', e);
                }
            }
        }

        async function loadFiles() {
            try {
                const response = await fetch('https://ton-backend.vercel.app/files?token=' + 
                    localStorage.getItem('accessToken'));
                const files = await response.json();
                
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = files.map(file => `
                    <div class="file-item">
                        <span>${file.name} (${(file.size/1024).toFixed(1)}ko)</span>
                        <div>
                            <a href="${file.url}" target="_blank">👁️</a>
                            <a href="https://ton-backend.vercel.app/delete/${file.id}?token=${localStorage.getItem('accessToken')}" 
                               onclick="return confirm('Supprimer?')">🗑️</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Erreur chargement:', e);
            }
        }

        function logout() {
            localStorage.removeItem('accessToken');
            window.location.href = 'index.html';
        }

        // Chargement initial
        loadFiles();
    </script>
</body>
</html>
